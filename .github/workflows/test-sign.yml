name: Snap Hutao Remastered Test

on:
  workflow_dispatch:

jobs:
  test-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build unsigned MSIX
        id: build
        shell: pwsh
        run: dotnet tool restore && dotnet cake test-sign.cake

      - name: Submit to SignPath for test signing
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $unsignedMsix = "${{ steps.build.outputs.msix-path }}"
          $signedMsix = [System.IO.Path]::Combine([System.IO.Path]::GetDirectoryName($unsignedMsix), "Snap.Hutao.Remastered.Test-${{ steps.build.outputs.version }}-signed.msix")

          Write-Host "Installing SignPath PowerShell module..."
          Install-Module -Name SignPath -Force -Scope CurrentUser

          Write-Host "Submitting signing request to SignPath..."
          Write-Host "  Input:  $unsignedMsix"
          Write-Host "  Output: $signedMsix"

          Submit-SigningRequest `
            -InputArtifactPath $unsignedMsix `
            -ApiToken $Env:SIGNPATH_API_TOKEN `
            -OrganizationId "ba79caf8-8aa3-44e6-8a7b-ac8541512be4" `
            -ProjectSlug "Snap.Hutao.Remastered" `
            -SigningPolicySlug "test-signing" `
            -OutputArtifactPath $signedMsix `
            -WaitForCompletion

          Write-Host "Signing completed."
          Write-Host "signed-msix=$signedMsix" >> $Env:GITHUB_OUTPUT

      - name: Upload signed MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Test-${{ steps.build.outputs.version }}-signed
          path: ${{ steps.signpath.outputs.signed-msix }}

      - name: Add summary
        shell: pwsh
        run: |
          $summary = @"
          ## Snap Hutao Remastered Test Build (SignPath Test Signing)

          - **Version:** ${{ steps.build.outputs.version }}
          - **Signing Policy:** test-signing
          - **Certificate:** CN=Test certificate for 'Snap.Hutao.Remastered [OSS]'

          > [!WARNING]
          > 该版本使用 SignPath 测试证书签名

          > [!IMPORTANT]
          > 安装前需将测试证书导入到 **受信任的人员(TrustedPeople)** 存储
          "@
          echo $summary >> $Env:GITHUB_STEP_SUMMARY
