name: Installer certificate policy

on:
  pull_request:
    paths:
      - 'Installer/**'
      - 'build-installer.cake'
      - 'publish.cake'
      - '.github/workflows/installer-certificate-policy.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'Installer/**'
      - 'build-installer.cake'
      - 'publish.cake'
      - '.github/workflows/installer-certificate-policy.yml'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify installer certificate policy
        shell: pwsh
        run: pwsh -NoProfile -File Installer/tests/Test-InstallerCertificatePolicy.ps1
